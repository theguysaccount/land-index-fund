# Weekly: the live site answers, its data matches the repository, sources are healthy, refreshes are not stalled
# (dispatches one when they are), every sitemap URL answers, and the browser test passes on the live site.
name: Weekly checks

on:
  schedule:
    - cron: "23 5 * * 4"
    # TEMPORARY (22-23 Nov 2026 only): proves the schedule trigger on this new repository. Remove after the first
    # scheduled run; it cannot fire on other dates.
    - cron: "17 * 22,23 11 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  LI_BASE_URL: ${{ vars.LI_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  LI_REPO: ${{ github.repository }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Live health and staleness
        run: python scripts/health.py "$LI_BASE_URL"

  links:
    if: github.event.schedule != '17 * 22,23 11 *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sitemap and external links
        run: python scripts/linkcheck.py "$LI_BASE_URL"

  browser:
    if: github.event.schedule != '17 * 22,23 11 *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Browser test of the live site
        env:
          CI: "1"
        run: CHROME="$(command -v google-chrome)" node scripts/e2e.mjs "$LI_BASE_URL"

  keepalive:
    needs: [live, links, browser]
    if: always() && github.event_name == 'schedule'
    uses: ./.github/workflows/keepalive.yml
